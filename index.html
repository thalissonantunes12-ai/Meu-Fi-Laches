<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <style>
        /* ==========================================
           1. RESET UNIVERSAL & CONFIGURAÇÕES DO BODY
           ========================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            /* Imagem de fundo configurada para cobrir a tela inteira */
            background-image: url("https://img.magnific.com/fotos-premium/uma-mesa-de-madeira-escura-vazia-em-frente-a-um-fundo-bokeh-borrado-abstrato-do-restaurante-pode-ser-usada-para_1319275-794.jpg?semt=ais_hybrid&w=740&q=80");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center bottom;
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
            background-color: #111; /* Cor escura caso a imagem demore a carrergar */
        }
        .medula-one-regular {
            font-family: "Medula One", system-ui, sans-serif;
            font-weight: 400;
            font-style: normal;
        }
        /* ==========================================
           2. MENU SUPERIOR (Alinhado à Direita)
           ========================================== */
        .pai {
            display: flex;
            flex-direction: row;
            justify-content: flex-end; 
            align-items: center;
            width: 100%;
            height: 64px;
            background-color: rgba(0, 0, 0, 0.75); 
            padding-right: 50px; 
            border-bottom: 2px solid #ffc52f;
        }
        .suspens {
            color: bisque;
            font-size: 22px;
            margin-left: 35px; 
            cursor: pointer;
        }
        .suspens a {
            color: bisque;
            text-decoration: none;
        }
        .suspens a:hover,
        .suspens a:focus-visible {
            color: #ffc52f;
        }
        .inicio u {
            text-decoration: none;
            border-bottom: 2px solid bisque;
            padding-bottom: 2px;
        }
        .rodape-pag3 {
            width: 100%;
            min-height: 58.5px;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 30px;
            padding: 13px 20px;
            margin-top: 30px;
        }
        .rodape-pag3 a {
            color: white;
            text-decoration: none;
            font-size: 20px;
            transition: 0.2s;
        }
        .rodape-pag3 a:hover,
        .rodape-pag3 a:focus-visible {
            color: #ffc52f;
        }
        /* ==========================================
           3. CONTAINER PRINCIPAL (Mágica da Centralização)
           ========================================== */
        .main-container {
            display: flex;
            max-width: 1200px;
            width: 100%;
            margin: 80px auto 0 auto; /* O 'auto' joga toda a estrutura para o centro da tela */
            padding: 0 40px;
            justify-content: space-between; /* Empurra os textos para a esquerda e o hambúrguer para a direita */
            align-items: center;
            flex-wrap: wrap; /* Faz o layout se ajustar caso a tela diminua */
        }
        /* COLUNA DOS TEXTOS (ESQUERDA) */
        .pai2 {
            flex: 1;
            min-width: 320px;
            max-width: 500px; 
            display: flex;
            flex-direction: column;
            gap: 25px; /* Distribui um espaço uniforme vertical entre as caixas */
        }
        /* Estilização das caixas com o fundo escuro transparente */
        .Titulo, .sub, .sub2 {
            background-color: rgba(0, 0, 0, 0.55);
            border-radius: 20px; 
            padding: 20px 25px;
            width: 75%;
        }
        /* Ajustes finos nos textos das caixas */
        .pfont {
            font-size: 32px;
            color: white;
            border-bottom: 2px solid white;
            display: inline-block;
            padding-bottom: 5px;
        }
        .sub h3 {
            font-size: 32px;
            font-weight: normal;
            color: rgba(245, 245, 245, 0.95);
            line-height: 1.3;
        }
        .sub2 h4 {
            font-size: 18px;
            font-weight: normal;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.4;
        }
        /* ==========================================
           4. BOTÃO VER CARDÁPIO
           ========================================== */
        .proximo {
            background-color: white;
            color: black;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            padding: 15px 35px;
            border-radius: 8px;
            align-self: flex-start;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            cursor: pointer;
        }
        .centrop {
            color: black;
        }
        /* ==========================================
           5. COLUNA DO HAMBÚRGUER (DIREITA)
           ========================================== */
        .conteudo-direito {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 320px;
            position:relative;
        }
        .hamburguer-img {
            max-width: 480px; 
            width: 100%;
            height: auto;
        }
    </style>

    <link rel="stylesheet" href="carrinho.css">

</head>

                </div>

            <button class="contact-card-close" type="button" data-contact-close>Fechar</button>
        </section>
    </div>
    <footer class="rodape-pag3">
        <a href="index.html">Início</a>
        <a href="pag2.html">Promoções</a>
        <a href="pag4.html">Cardápio</a>
        <a href="pag3.html">Avaliações</a>
        <button class="contact-toggle" type="button" data-contact-toggle aria-controls="contact-panel" aria-expanded="false">Contatos</button>
    </footer>
